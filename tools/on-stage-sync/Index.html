<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:Arial,sans-serif;background:#000;color:#fff;max-width:620px;margin:0 auto;padding:32px}
    h1{font-weight:400;letter-spacing:.06em}button{background:#fff;color:#000;border:0;padding:14px 22px;border-radius:4px;font-size:16px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
    input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 14px;background:#111;border:1px solid #555;color:#fff;border-radius:3px}label{font-size:13px}.status{margin:20px 0;line-height:1.6}.result{margin-top:20px;padding:14px;background:#111;line-height:1.7}.small{font-size:12px;opacity:.7;line-height:1.5}.bar{height:8px;background:#333;margin:12px 0}.fill{height:100%;background:#fff;width:0}.muted{opacity:.65;font-size:13px}
  </style>
</head>
<body>
  <h1>VON ZIPPEN — ON STAGE</h1>
  <p>Manage the photos shown in the On Stage slideshow.</p>
  <div class="status" id="status">Checking setup…</div>
  <div id="last"></div>
  <details><summary>One-time setup</summary><p class="small">The Google Drive folder is already configured. You only need to enter the GitHub token once. It is stored in this Apps Script project, not on the website.</p><label>GitHub token</label><input id="token" type="password" placeholder="github_pat_..."><button onclick="save()">SAVE SETUP</button></details>
  <hr style="margin:28px 0;border-color:#222">
  <button id="sync" onclick="sync()">↻ SYNC NOW</button>
  <div id="result"></div>
  <script>
    const AUTO_MESSAGE=<?!=JSON.stringify(autoSyncMessage||'')?>;
    const CHUNK_BYTES=786432;
    let busy=false;
    let currentProgress=null;

    function fmt(iso){if(!iso)return'—';return new Date(iso).toLocaleString('it-CH',{dateStyle:'medium',timeStyle:'short'});}
    function showError(e){
      busy=false;
      const message=e&&e.message?e.message:String(e);
      document.getElementById('sync').disabled=false;
      document.getElementById('sync').textContent='↻ SYNC NOW';
      document.getElementById('result').textContent='Error: '+message+' — You can press SYNC NOW to retry.';
      google.script.run.recordSyncError(message);
    }
    function renderStatus(s){
      document.getElementById('status').textContent=s.githubConfigured?'✓ Ready to sync.':'Setup incomplete — enter the GitHub token above.';
      document.getElementById('last').textContent=s.lastSync?'Last sync: '+fmt(s.lastSync.completedAt):'';
      if(s.lastError&&!busy)document.getElementById('result').textContent='Last error: '+s.lastError;
      if(s.syncing&&s.progress){currentProgress=s.progress;renderProgress(s.progress);}
    }
    function renderProgress(p){
      const pct=p.total?Math.round(p.processed/p.total*100):100;
      const phase=p.phase==='delete'?'Finalizing':'Optimizing and uploading';
      document.getElementById('sync').disabled=true;
      document.getElementById('sync').textContent='SYNCING…';
      document.getElementById('result').innerHTML='<div class="result"><b>🔄 '+phase+'</b><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div>'+p.processed+' / '+p.total+' photos ('+pct+'%)<br>🟢 Added: '+p.added+'<br>🔄 Updated: '+p.updated+'<br>⏭ Skipped: '+p.skipped+'<br>🔴 Removed: '+p.removed+'<br><span class="muted">Keep this page open until the sync is complete.</span></div>';
    }
    function refresh(){
      google.script.run.withSuccessHandler(function(s){
        renderStatus(s);
        if(s.syncing&&!busy){busy=true;runNext();}
      }).withFailureHandler(showError).getStatus();
    }
    function save(){
      const token=document.getElementById('token').value;
      if(!token)return alert('Please enter the GitHub token.');
      google.script.run.withSuccessHandler(function(){
        document.getElementById('result').textContent='Setup saved.';
        document.getElementById('token').value='';
        refresh();
      }).withFailureHandler(showError).setGithubToken(token);
    }
    function sync(){
      if(busy)return;
      busy=true;
      document.getElementById('sync').disabled=true;
      document.getElementById('sync').textContent='STARTING…';
      google.script.run.withSuccessHandler(function(r){
        currentProgress={phase:'upload',processed:0,total:r.total,added:0,updated:0,skipped:0,removed:0};
        runNext();
      }).withFailureHandler(showError).startSync();
    }
    function runNext(){
      google.script.run.withSuccessHandler(function(s){
        if(!s.syncing){complete(s.lastSync);return;}
        currentProgress=s.progress;
        renderProgress(s.progress);
        if(s.progress.phase==='upload'){
          if(s.progress.processed>=s.progress.total){
            google.script.run.withSuccessHandler(runNext).withFailureHandler(showError).finishUploads();
          }else{
            processPhoto(s.progress.processed);
          }
        }else{
          google.script.run.withSuccessHandler(runNext).withFailureHandler(showError).deleteNextOldPhoto();
        }
      }).withFailureHandler(showError).getStatus();
    }
    function processPhoto(index){
      google.script.run.withSuccessHandler(function(info){
        fetchPhotoChunks(index,info,0,[]);
      }).withFailureHandler(showError).getPhotoInfo(index);
    }
    function fetchPhotoChunks(index,info,offset,parts){
      if(offset>=info.size){
        const original=parts.join('');
        if(info.mime==='image/gif'){
          uploadPhoto(index,original,'image/gif');
        }else{
          compressPhoto(original,info.mime,function(compressed){
            uploadPhoto(index,compressed,'image/jpeg');
          });
        }
        return;
      }
      google.script.run.withSuccessHandler(function(part){
        parts.push(part);
        const padding=part.endsWith('==')?2:(part.endsWith('=')?1:0);\n        const bytes=part.length*3/4-padding;
        fetchPhotoChunks(index,info,offset+bytes,parts);
      }).withFailureHandler(showError).getPhotoChunk(index,offset);
    }
    function compressPhoto(base64,mime,done){
      const image=new Image();
      image.onload=function(){
        const scale=Math.min(1,2000/Math.max(image.naturalWidth,image.naturalHeight));
        const width=Math.max(1,Math.round(image.naturalWidth*scale));
        const height=Math.max(1,Math.round(image.naturalHeight*scale));
        const canvas=document.createElement('canvas');
        canvas.width=width;canvas.height=height;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);
        ctx.drawImage(image,0,0,width,height);
        canvas.toBlob(function(blob){
          if(!blob){showError(new Error('Could not compress '+mime+' image.'));return;}
          const reader=new FileReader();
          reader.onload=function(){
            done(String(reader.result).split(',')[1]);
          };
          reader.onerror=function(){showError(new Error('Could not read compressed image.'));};
          reader.readAsDataURL(blob);
        },'image/jpeg',0.84);
      };
      image.onerror=function(){showError(new Error('Could not open one of the Drive photos.'));};
      image.src='data:'+mime+';base64,'+base64;
    }
    function uploadPhoto(index,base64,mime){
      google.script.run.withSuccessHandler(function(){runNext();})
        .withFailureHandler(showError).uploadOptimizedPhoto(index,base64,mime);
    }
    function complete(result){
      busy=false;
      document.getElementById('sync').disabled=false;
      document.getElementById('sync').textContent='↻ SYNC NOW';
      document.getElementById('result').innerHTML='<div class="result"><b>✓ Sync complete</b><br>Photos: '+result.total+'<br>Added: '+result.added+'<br>Updated: '+result.updated+'<br>Removed: '+result.removed+'</div>';
      refresh();
    }
    refresh();
    if(AUTO_MESSAGE){document.getElementById('result').textContent=AUTO_MESSAGE;}
  </script>
</body>
</html>
